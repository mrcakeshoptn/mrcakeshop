name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # This repo deploys to https://mrcakeshoptn.github.io/mrcakeshop/, a
          # GitHub Pages *project* page served from the "/mrcakeshop" sub-path.
          # next.config.mjs already defaults to "/mrcakeshop" on its own, so this
          # line is mostly here so it's obvious how to change it: set it to ''
          # only if you switch to a custom domain (public/CNAME) or a user/org
          # page, or to '/<new-repo-name>' if you rename the GitHub repo.
          NEXT_PUBLIC_BASE_PATH: '/mrcakeshop'
          # Supabase project credentials — set these in Settings → Secrets and
          # variables → Actions. The anon key is safe to expose (it's the
          # public client key; real access control is Postgres Row Level
          # Security, not secrecy of this key) but it still lives as a repo
          # secret here so it's easy to rotate without a code change.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
